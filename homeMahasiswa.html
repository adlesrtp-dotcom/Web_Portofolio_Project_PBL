<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard PBL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            background: #6b6b6b;
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 1100px;
            min-height: 600px;
            background: #fff;
            border: 4px solid #0099dd;
        }

        /* HEADER */
        .header {
            background: #00a3e0;
            color: white;
            padding: 20px;
            font-size: 26px;
            font-weight: bold;
        }

        /* MAIN LAYOUT */
        .main {
            display: flex;
            min-height: 500px;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            border-right: 3px solid #000;
            padding: 25px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            font-size: 20px;
            margin-bottom: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }

        .sidebar li:hover {
            color: #00a3e0;
        }

        .sidebar .active {
            font-weight: bold;
        }

        /* CONTENT */
        .content {
            flex: 1;
            padding: 40px;
            position: relative;
        }

        .cards {
            display: flex;
            gap: 40px;
        }

        .card {
            width: 180px;
            height: 140px;
            background: #00a3e0;
            color: white;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.25);
        }

        /* BUTTON NEXT */
        .next-btn {
            position: absolute;
            bottom: 30px;
            right: 40px;
            background: #00a3e0;
            color: #000;
            border: none;
            padding: 14px 35px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .next-btn:hover {
            background: #008cc4;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        Welcome
    </div>

    <!-- MAIN -->
    <div class="main">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <ul>
                <li class="active">Home ▶</li>
                <li>Project</li>
                <li>Manage Project</li>
                <li>Log Out</li>
            </ul>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <div class="cards">
                <div class="card">
                    Title<br>PBL
                </div>
                <div class="card">
                    Title<br>PBL
                </div>
                <div class="card">
                    Title<br>PBL
                </div>
            </div>

            <button class="next-btn">Next</button>
        </div>
    </div>
</div>
</body>
</html>
