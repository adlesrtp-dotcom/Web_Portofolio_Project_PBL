<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar — Portofolio PBL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1e40af',
            secondary: '#dbeafe',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
    body { font-family: 'Poppins', sans-serif; }
    .fade-in { animation: fadeIn 0.4s ease-in; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden fade-in">
    <!-- Header -->
    <div class="bg-primary text-white text-center py-6 px-6">
      <img src="../../public/img/logo.png" alt="Logo Polibatam" class="mx-auto h-16 w-auto mb-3">
      <h1 class="text-2xl font-semibold">Daftar Akun</h1>
      <p class="text-blue-100 mt-1">Portofolio Proyek PBL</p>
    </div>

    <!-- Form -->
    <form method="POST" action="../register.php" class="p-6 space-y-5">
      <!-- Nama -->
      <div>
        <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
        <input
          type="text"
          id="nama"
          name="nama"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition"
          placeholder="Contoh: Jhone Due"
          required
          autocomplete="name"
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
          placeholder="nama@polibatam.ac.id"
          required
          autocomplete="email"
        />
      </div>

      <!-- Role -->
      <fieldset>
        <legend class="block text-sm font-medium text-gray-700 mb-2">Peran</legend>
        <div class="flex space-x-4">
          <label class="flex items-center">
            <input
              type="radio"
              name="role"
              value="dosen"
              class="h-4 w-4 text-primary focus:ring-primary"
              required
            />
            <span class="ml-2 text-gray-700">Dosen</span>
          </label>
          <label class="flex items-center">
            <input
              type="radio"
              name="role"
              value="mahasiswa"
              class="h-4 w-4 text-primary focus:ring-primary"
            />
            <span class="ml-2 text-gray-700">Mahasiswa</span>
          </label>
        </div>
      </fieldset>

      <!-- NIM (muncul dinamis) -->
      <div id="nimField" class="hidden">
        <label for="nim" class="block text-sm font-medium text-gray-700 mb-1">NIM</label>
        <input
          type="text"
          id="nim"
          name="nim"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
          placeholder="Contoh: 331234567890"
          pattern="[0-9]{10,12}"
          title="NIM harus 10–12 digit angka"
          maxlength="12"
        />
        <p class="mt-1 text-xs text-gray-500">10–12 digit angka, tanpa spasi</p>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
          placeholder="Minimal 8 karakter"
          minlength="8"
          required
          autocomplete="new-password"
        />
        <p class="mt-1 text-xs text-gray-500">Minimal 8 karakter, kombinasi huruf & angka disarankan</p>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full bg-primary hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow-md hover:shadow-lg"
      >
        Daftar Sekarang
      </button>

      <div class="text-center text-sm text-gray-600">
        Sudah punya akun? <a href="../login/login.php" class="text-primary font-medium hover:underline">Masuk di sini</a>
      </div>
    </form>
  </div>

  <script>
    // Hanya untuk show/hide NIM field
    document.querySelectorAll('input[name="role"]').forEach(radio => {
      radio.addEventListener('change', function () {
        const nimField = document.getElementById('nimField');
        const nimInput = document.getElementById('nim');
        if (this.value === 'mahasiswa') {
          nimField.classList.remove('hidden');
          nimInput.setAttribute('required', 'required');
        } else {
          nimField.classList.add('hidden');
          nimInput.removeAttribute('required');
          nimInput.value = '';
        }
      });
    });
  </script>
</body>
</html>
